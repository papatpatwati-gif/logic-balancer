<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Manajemen Keluarga</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f9fafb;
            --text: #111827;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #9ca3af;
        }
        .extra-links {
            text-align: right;
            margin-bottom: 1rem;
            font-size: 0.8rem;
        }
        .extra-links a {
            color: var(--primary);
            text-decoration: none;
        }
        .extra-links a:hover { text-decoration: underline; }
        #google-btn {
            background-color: #ffffff;
            color: #333;
            border: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        #google-btn img {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">🏠 Manajemen Keluarga</div>
    <p class="subtitle">Silakan masuk untuk mengelola jurnal harian Anda secara bijak.</p>
    
    <input type="email" id="email" placeholder="Email Terdaftar" required>
    <input type="password" id="password" placeholder="Kata Sandi" required>
    
    <div class="extra-links">
        <a href="#" onclick="resetPassword()">Lupa Kata Sandi?</a>
    </div>

    <button onclick="login()">Masuk ke Dashboard</button>

    <div style="margin: 1rem 0; text-align: center; color: #9ca3af; font-size: 0.8rem;">atau</div>

    <button onclick="loginWithGoogle()" id="google-btn">
        <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" alt="Google logo">
        Masuk dengan Google
    </button>

    <div class="footer-note">
        Situs ini adalah aplikasi internal untuk edukasi manajemen keuangan keluarga syariah.
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    // Konfigurasi Firebase untuk Logic Balancer Premium
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB7aWSghbfFDj8k7bXuvNZLSlADunEjs78",
  authDomain: "logic-balancer-premium.firebaseapp.com",
  projectId: "logic-balancer-premium",
  storageBucket: "logic-balancer-premium.firebasestorage.app",
  messagingSenderId: "1048897053276",
  appId: "1:1048897053276:web:eccf5562cd539acd0b3c99",
  measurementId: "G-497LL8JFRV"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) return alert("Mohon isi semua bidang.");

        firebase.auth().signInWithEmailAndPassword(email, password)
            .then(() => {
                // Jika berhasil, pindah ke halaman dashboard (misal: dashboard.html)
                window.location.href = "dashboard.html"; 
            })
            .catch((error) => {
                alert("Gagal masuk: " + error.message);
            });
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider)
            .then((result) => {
                const user = result.user;
                const userRef = db.collection('users').doc(user.uid);

                // Cek apakah pengguna sudah ada di Firestore
                userRef.get().then((doc) => {
                    if (!doc.exists) {
                        // Jika tidak ada, buat dokumen baru untuk pengguna
                        userRef.set({
                            email: user.email,
                            displayName: user.displayName,
                            isActive: true, // Langsung aktifkan pengguna baru
                            status: 'Anggota', // Status default
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            window.location.href = "dashboard.html";
                        });
                    } else {
                        // Jika sudah ada, langsung arahkan ke dashboard
                        window.location.href = "dashboard.html";
                    }
                });
            }).catch((error) => {
                alert("Gagal masuk dengan Google: " + error.message);
            });
    }

    function resetPassword() {
        const email = prompt("Untuk mereset kata sandi, silakan masukkan alamat email Anda:");
        if (email) {
            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    alert("Tautan untuk mereset kata sandi telah dikirim ke email Anda. Silakan periksa kotak masuk (dan folder spam).");
                })
                .catch((error) => {
                    alert("Gagal mengirim email reset: " + error.message);
                });
        }
    }
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => {
        console.log('Service Worker terdaftar:', reg);
      })
      .catch(err => {
        console.warn('Service Worker gagal didaftarkan:', err);
      });
  });
}
</script>

</body>
</html>
